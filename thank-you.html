<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Neal Coxworth</title>
    <link rel="icon" type="image/svg+xml" href="assets/neal-coxworth-logo.svg" />
    <link rel="stylesheet" href="styles/main.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .thank-you {
        width: min(720px, calc(100% - 2rem));
        margin: 4rem auto;
        padding: 2.5rem 2rem;
        border: 1px solid rgba(212, 176, 109, 0.2);
        border-radius: 24px;
        background: rgba(12, 16, 20, 0.9);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      .thank-you h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }
      .thank-you p {
        margin: 0 0 1.5rem;
        color: #d8d0c5;
      }
    </style>
  </head>
  <body>
    <main class="thank-you">
      <p class="eyebrow">Contact</p>
      <h1>Thank you</h1>
      <p>Your message has been sent successfully. Neal will get back to you shortly.</p>
      <a class="button button-primary" href="index.html">Back to home</a>
    </main>
  </body>
</html>
